{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-success text-white text-center">
                    <h4 class="mb-0">📡 Enviar Datos de Sensor</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{% url 'agromaker_soil:registrar_dato' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Lote / Ubicación:</label>
                            <input type="text" name="lote" class="form-control" value="San Bernardo, Filadelfia" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">pH (Acidez):</label>
                                <input type="number" step="0.1" name="ph" class="form-control" placeholder="Ej: 5.2" min="0" max="14" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Humedad (%):</label>
                                <input type="number" step="0.1" name="humedad" class="form-control" placeholder="Ej: 85" min="0" max="100" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Conductividad (opcional):</label>
                            <input type="number" step="0.1" name="conductividad" class="form-control" placeholder="Ej: 45.5">
                        </div>
                        <button type="submit" class="btn btn-success w-100 btn-lg">Sincronizar con la Nube 🚀</button>
                    </form>
                </div>
                <div class="card-footer text-center small text-muted">
                    Activo subsidiado — Agromaker Colombia AI
                </div>
            </div>
            <div class="text-center mt-3">
                <a href="{% url 'agromaker_soil:reporte_campesino' %}" class="text-decoration-none">← Volver al Monitor de Suelos</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
