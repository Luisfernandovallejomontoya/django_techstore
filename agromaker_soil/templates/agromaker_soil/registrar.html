<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Campo - Agromaker AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg bg-secondary text-white border-0">
                    <div class="card-header bg-success text-center">
                        <h4>📡 Enviar Datos de Sensor</h4>
                    </div>
                    <div class="card-body p-4">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Lote / Ubicación:</label>
                                <input type="text" name="lote" class="form-control" value="San Bernardo, Filadelfia" required>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label">pH (Acidez):</label>
                                    <input type="number" step="0.1" name="ph" class="form-control" placeholder="Ej: 5.2" required>
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label">Humedad (%):</label>
                                    <input type="number" step="0.1" name="humedad" class="form-control" placeholder="Ej: 85" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100 btn-lg mt-3">Sincronizar con la Nube 🚀</button>
                        </form>
                    </div>
                    <div class="card-footer text-center small text-light">
                        Activo subsidiado - Agromaker Colombia AI
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a href="{% url 'reporte_campesino' %}" class="text-info text-decoration-none">← Volver al Monitor Individual</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
