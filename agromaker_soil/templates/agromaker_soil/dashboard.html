<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agromaker AI - Dashboard de Suelos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-success mb-4">🌱 Monitor de Suelos - Filadelfia</h1>
        <div class="row">
            {% for r in registros %}
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title fw-bold text-primary">{{ r.lote }}</h5>
                        <p class="text-muted small">Fecha: {{ r.fecha|date:"d/m/Y" }}</p>
                        <hr>
                        <p class="h3">pH: <strong>{{ r.ph }}</strong></p>
                        <div class="mt-3">
                            <span class="badge {% if 'ÁCIDO' in r.interpretacion_ph %}bg-danger{% elif 'ÓPTIMO' in r.interpretacion_ph %}bg-success{% else %}bg-info{% endif %} p-2 w-100">
                                {{ r.interpretacion_ph }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12"><p class="alert alert-warning">No hay registros aún.</p></div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
