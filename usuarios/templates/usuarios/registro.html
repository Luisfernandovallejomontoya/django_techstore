{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 shadow">
                <h2 class="card-title text-center mb-4">Crear Cuenta</h2>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Por favor corrige los errores del formulario.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-success btn-block mt-3 w-100">
                        Registrarse
                    </button>
                </form>

                <div class="text-center mt-4">
                    <hr>
                    <small class="text-muted">
                        ¿Ya tienes una cuenta?
                        <a href="{% url 'usuarios:login' %}" class="font-weight-bold">Inicia sesión</a>
                    </small>
                </div>
            </div>

            <div class="text-center mt-3">
                <a href="{% url 'productos:catalogo' %}" class="text-secondary small">← Volver al catálogo</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
